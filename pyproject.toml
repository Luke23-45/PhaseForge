[project]
name = "phaseforge"
version = "0.1.0"
description = "Phase-Bootstrapped Mixture-of-Experts for Long-Horizon Robotic Manipulation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "torch>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "h5py>=3.10",
    "numpy>=1.26",
    "wandb>=0.16",
    "tqdm>=4.66",
    "rich>=13.7",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    # LIBERO dataset download from the HuggingFace mirror
    "huggingface_hub>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]
# LIBERO environment simulation (Linux + GPU required; heavy install:
# pulls robosuite 1.4, mujoco, robomimic, bddl). Install only on the
# evaluation machine:  uv sync --extra rollout
# Pins match LIBERO's own requirements: mujoco 2.3.7 is the last release
# exposing mjData.qM (removed in 3.0, which breaks robosuite's OSC
# controller with AttributeError: 'MjData' object has no attribute 'qM').
# numpy is pinned <2 because mujoco 2.3.7 / robosuite 1.4.x wheels are
# compiled against numpy 1.x (numpy>=2 raises "numpy.dtype size changed,
# may indicate binary incompatibility" at import time).
rollout = [
    "numpy==1.26.4",
    "robosuite==1.4.1",
    "mujoco==2.3.7",
    "libero",
]

[project.scripts]
phaseforge-train = "phaseforge.cli:train"
phaseforge-eval  = "phaseforge.cli:evaluate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phaseforge"]
force-include = { "phaseforge/config" = "phaseforge/config" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
