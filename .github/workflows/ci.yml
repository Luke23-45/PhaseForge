# CI gate (professor review item 5): ruff's exit code IS the gate — a red
# build is unmissable, independent of whatever a human happened to scroll to.
# No GPU / LIBERO here: the real rollout sweep needs the `rollout` extra
# (robosuite/libero) plus a GPU and runs manually per docs/dev/colab_protocol.md.
# The unit tests + runner dry-run smoke below cover the full aggregation
# logic on CPU.
#
# NOTE: `uv sync --extra dev` installs the full runtime (torch, etc.) to run
# the real test suite — heavy on first run (torch wheels), cached afterwards.

name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff, exit-code gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: ruff check (scripts/ is in the same gate as phaseforge/ and tests/)
        run: uv run ruff check phaseforge tests scripts
      - name: mypy (eval harness — professor item 7.2)
        run: uv run mypy phaseforge/evaluations/runners/multi_seed_summary.py scripts/run_multi_seed_eval.py

  test:
    name: Tests (pytest, CPU-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Run test suite
        run: uv run pytest -q --tb=short
