# config/train/stage1.yaml — Stage 1: Phase-supervised generalist pretraining

stage: 1
epochs: 100
grad_clip_norm: 1.0
lambda_phase: 1.0         # Weight on the auxiliary phase classification loss
# Phase-head class weighting for the CE loss. "none" = plain CE (protocol).
# "balanced" = inverse-frequency weights computed from the TRAINING split
# (counts written to metadata/phase_weights.json). Counteracts the severe
# phase imbalance in Lift (phases 1/5 ≈ 1.2%/0.6% of steps) that lets the
# head overfit majority phases (report §5.3, val/loss_phase 2.59 > ln6).
phase_class_weight: "none"
# Computed automatically when phase_class_weight="balanced" (inverse-frequency
# weights over the training split). Leave null otherwise.
phase_weights: null
log_every_n_steps: 50
rich_progressbar: false
# One compact progress line for epochs; the batch-level bar above remains
# opt-in so cloud logs do not become noisy.
epoch_progressbar: true

optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 100              # Matches epochs
  eta_min: 1.0e-6

checkpoint:
  every_n_epochs: 10
  monitor: "val/loss_action"
  mode: "min"             # Save when val loss decreases
  save_top_k: 1

early_stopping:
  enabled: false          # Locked protocol (A4/C5): full-length 100-epoch runs;
                          # ad-hoc runs must opt IN via train.early_stopping.enabled=true
  monitor: "val/loss_action"
  mode: "min"
  patience: 10
  min_delta: 0.001


# Path to the Stage 1 best checkpoint (Stage 2 only; null = auto-detect).
stage1_ckpt_path: null
freeze_encoder: false

# Optional resume: path to a checkpoint saved by CheckpointCallback. Restores
# model/optimizer/scheduler/RNG/callback state and continues from the recorded
# epoch (null = fresh run).
resume_from: null
