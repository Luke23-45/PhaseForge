# config/models/baselines/plain_encoder_phase_bootstrap.yaml — C1 cell:
# plain (BC) encoder x CENTROID router (isolates the centroid router init
# without phase supervision)
#
# Shares the BC Stage 1 checkpoint (resolve_checkpoint_source maps this
# name to "bc"); the MoE is bootstrapped with phase centroids computed over
# the plain encoder's latent space, exactly like phaseforge. Comparing with
# warmstart_moe isolates the centroid-init effect; comparing with phaseforge
# isolates the phase-supervised-encoder effect.

name: "plain_encoder_phase_bootstrap"
_target_: phaseforge.models.baselines.plain_encoder_phase_bootstrap.PlainEncoderPhaseBootstrapModel

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: 151          # Matches data.state_dim (23 + 16*7 objects + 16 mask)
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true

action_head:
  _target_: phaseforge.models.components.action_head.ActionHead
  input_dim: 128
  output_dim: 7
  head_type: "deterministic"
  hidden_dim: 256

router:
  _target_: phaseforge.models.components.router.TopKRouter
  latent_dim: 128
  num_experts: 6
  top_k: 2
  noise_std: 0.1
  balance_coeff: 0.01

expert:
  _target_: phaseforge.models.components.expert.ExpertMLP
  input_dim: 128
  hidden_dims: [256, 256]
  output_dim: 7
  activation: "gelu"

num_phases: 6
