# config/models/baselines/plain_encoder_phase_bootstrap.yaml — C1 cell:
# plain (BC) encoder x CENTROID router (isolates the phase-supervised
# representation at fixed centroid routing)
#
# Shares the BC Stage 1 checkpoint (resolve_checkpoint_source maps this
# name to "bc"); the MoE is bootstrapped with phase centroids computed over
# the plain encoder's latent space, exactly like the canonical phaseforge.
# The expert init is pinned to the canonical R50 50% partial warm-start so
# this cell is an exact factorial control: comparing with phaseforge
# isolates the phase-supervised-encoder effect; comparing with
# phase_pretrain_random_router isolates the router-init effect at the same
# partial-warm expert init.

name: "plain_encoder_phase_bootstrap"
_target_: phaseforge.models.baselines.plain_encoder_phase_bootstrap.PlainEncoderPhaseBootstrapModel

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: ${data.state_dim}
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true

action_head:
  _target_: phaseforge.models.components.action_head.ActionHead
  input_dim: 128
  output_dim: ${data.action_dim}
  head_type: "deterministic"
  hidden_dim: 256

router:
  _target_: phaseforge.models.components.router.TopKRouter
  latent_dim: 128
  num_experts: 6
  top_k: 2
  noise_std: 0.1
  balance_coeff: 0.01
  normalize_input: true   # Unit-norm latents + unit-norm centroid weights
                          # (set by bootstrap_moe) => true cosine routing.

expert:
  _target_: phaseforge.models.components.expert.ExpertMLP
  input_dim: 128
  # Single hidden layer matching action_head.hidden_dim so the Stage 1
  # ActionHead can be copied into the experts exactly (strict warm start).
  hidden_dims: [256]
  output_dim: ${data.action_dim}
  activation: "gelu"

num_phases: 6

expert_init:
  # R50-matched control: identical expert initialization to the canonical
  # phaseforge method (50% partial warm-start, seed tied to training seed).
  type: "partial_warm"
  drop_rate: 0.5
  jitter_std: 0.0
  seed: ${project.seed}
