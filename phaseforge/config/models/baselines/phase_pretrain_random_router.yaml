# config/models/baselines/phase_pretrain_random_router.yaml — C1 cell:
# phase-supervised encoder x RANDOM router (isolates the centroid router init)
#
# Shares the phaseforge Stage 1 checkpoint (resolve_checkpoint_source maps
# this name to "phaseforge"); the MoE is bootstrapped with a random router,
# exactly like warmstart_moe. Comparing with phaseforge isolates the
# centroid-init effect; comparing with warmstart_moe isolates the
# phase-supervised-encoder effect.

name: "phase_pretrain_random_router"
_target_: phaseforge.models.baselines.phase_pretrain_random_router.PhasePretrainRandomRouterModel

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: 151          # Matches data.state_dim (23 + 16*7 objects + 16 mask)
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true

action_head:
  _target_: phaseforge.models.components.action_head.ActionHead
  input_dim: 128
  output_dim: 7
  head_type: "deterministic"
  hidden_dim: 256

router:
  _target_: phaseforge.models.components.router.TopKRouter
  latent_dim: 128
  num_experts: 6
  top_k: 2
  noise_std: 0.1
  balance_coeff: 0.01

expert:
  _target_: phaseforge.models.components.expert.ExpertMLP
  input_dim: 128
  # Single hidden layer matching action_head.hidden_dim so the Stage 1
  # ActionHead can be copied into the experts exactly (strict warm start).
  hidden_dims: [256]
  output_dim: 7
  activation: "gelu"
