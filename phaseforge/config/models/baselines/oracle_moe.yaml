# config/models/baselines/oracle_moe.yaml — Oracle-Phase MoE (upper bound)

name: "oracle_moe"
_target_: phaseforge.models.baselines.oracle_moe.OraclePhaseMoEModel

# No Stage 1 pretraining exists for this baseline, so the encoder MUST be
# trainable in Stage 2 (same reasoning as scratch_moe). A frozen random
# encoder would make this "upper bound" strictly worse than BC.
freeze_encoder: false

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: ${data.state_dim}
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true

router:
  _target_: phaseforge.models.components.router.TopKRouter
  latent_dim: 128
  num_experts: 6
  top_k: 2
  noise_std: 0.0          # No noise for oracle routing supervision
  balance_coeff: 0.01

expert:
  _target_: phaseforge.models.components.expert.ExpertMLP
  input_dim: 128
  # Single hidden layer: identical architecture across all cells so the
  # factorial comparison differs only in initialization, not capacity.
  hidden_dims: [256]
  output_dim: ${data.action_dim}
  activation: "gelu"

num_phases: 6
