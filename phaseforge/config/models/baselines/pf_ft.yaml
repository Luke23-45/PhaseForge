# config/models/baselines/pf_ft.yaml — Fine-Tuning Variant (PhaseForge-FT)
# Phase-supervised Stage-1 encoder + Phase Centroid Router + Warmstart Experts
# Encoder unfrozen in Stage 2 with scaled learning rate (encoder_lr_scale=0.1).

name: "pf_ft"
_target_: phaseforge.models.phase_moe.PhaseBootstrappedMoE

freeze_encoder: false
encoder_lr_scale: 0.1

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: ${data.state_dim}
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true

action_head:
  _target_: phaseforge.models.components.action_head.ActionHead
  input_dim: 128
  output_dim: ${data.action_dim}
  head_type: "deterministic"
  hidden_dim: 256

phase_head:
  _target_: phaseforge.models.components.phase_head.PhaseClassificationHead
  latent_dim: 128
  num_phases: 6

router:
  _target_: phaseforge.models.components.router.TopKRouter
  latent_dim: 128
  num_experts: 6
  top_k: 2
  noise_std: 0.1
  balance_coeff: 0.01
  normalize_input: true

expert:
  _target_: phaseforge.models.components.expert.ExpertMLP
  input_dim: 128
  hidden_dims: [256]
  output_dim: ${data.action_dim}
  activation: "gelu"

router_init:
  type: "centroid"

expert_init:
  type: "warmstart"
  jitter_std: 0.02
