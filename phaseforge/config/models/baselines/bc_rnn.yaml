# State-only temporal BC comparator using the same state/action schema.
name: "bc_rnn"
_target_: phaseforge.models.baselines.bc_rnn.BehaviorCloningRNNModel

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: ${data.state_dim}
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true

rnn_type: "lstm"
hidden_dim: 256
num_layers: 2
dropout: 0.0

action_head:
  _target_: phaseforge.models.components.action_head.ActionHead
  input_dim: 256
  output_dim: ${data.action_dim}
  head_type: "deterministic"
  hidden_dim: 256
