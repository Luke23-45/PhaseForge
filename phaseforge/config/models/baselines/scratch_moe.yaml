# config/models/baselines/scratch_moe.yaml — Scratch MoE (random init, no pretraining)

name: "scratch_moe"
_target_: phaseforge.models.baselines.scratch_moe.ScratchMoEModel

# No Stage 1 pretraining exists for this baseline, so the encoder MUST be
# trainable in Stage 2. The Stage 2 config default (freeze_encoder: true)
# would otherwise freeze a random encoder, crippling the baseline.
freeze_encoder: false

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: 87           # Matches data.state_dim (23 + 8*7 objects + 8 mask)
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true

router:
  _target_: phaseforge.models.components.router.TopKRouter
  latent_dim: 128
  num_experts: 6
  top_k: 2
  noise_std: 0.1
  balance_coeff: 0.01

expert:
  _target_: phaseforge.models.components.expert.ExpertMLP
  input_dim: 128
  # Single hidden layer: identical architecture across all cells so the
  # factorial comparison differs only in initialization, not capacity.
  hidden_dims: [256]
  output_dim: 7
  activation: "gelu"
