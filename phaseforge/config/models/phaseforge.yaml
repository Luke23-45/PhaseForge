# config/models/phaseforge.yaml — Phase-Bootstrapped MoE (proposed method)

name: "phaseforge"
_target_: phaseforge.models.phase_moe.PhaseBootstrappedMoE

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: ${data.state_dim}
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true

action_head:
  _target_: phaseforge.models.components.action_head.ActionHead
  input_dim: 128
  output_dim: ${data.action_dim}
  head_type: "deterministic"
  hidden_dim: 256

phase_head:
  _target_: phaseforge.models.components.phase_head.PhaseClassificationHead
  latent_dim: 128
  num_phases: 6

router:
  _target_: phaseforge.models.components.router.TopKRouter
  latent_dim: 128
  num_experts: 6
  top_k: 2
  noise_std: 0.1
  balance_coeff: 0.01
  normalize_input: true   # Unit-norm latents + unit-norm centroid weights
                          # (set by bootstrap_moe) => true cosine routing.
  # Phase-utilization study (docs/research/phase_utilization_design.md):
  # init: "centroid" (protocol) | "phase_head" (V1: router starts as the
  # exact stage-1 phase predictor). anchor: null | "phase_head" (V6: frozen
  # phase-head backbone + zero-init low-rank residual). Requires
  # init="phase_head" when anchor="phase_head".
  init: "centroid"
  anchor: null
  anchor_rank: 4

expert:
  _target_: phaseforge.models.components.expert.ExpertMLP
  input_dim: 128
  # Single hidden layer matching action_head.hidden_dim so the Stage 1
  # ActionHead can be copied into the experts exactly (strict warm start).
  hidden_dims: [256]
  output_dim: ${data.action_dim}
  activation: "gelu"

# Phase-utilization study: when true, the Stage 2 forward also emits the
# frozen stage-1 phase head logits (ModelOutput.phase_logits) for
# distillation (V2) / decoding (V5) use. Protocol default: false.
emit_phase_logits: false
