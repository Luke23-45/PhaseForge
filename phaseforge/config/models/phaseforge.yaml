# config/models/phaseforge.yaml — canonical PhaseForge configuration
#
# The R50 implementation (50% partial warm-start, Drop-Upcycling-style)
# promoted to the canonical `phaseforge` identity: six experts, top-2
# routing, centroid router initialization, seed-dependent partial expert
# reinitialization, soft mapping disabled. Self-contained by design — the
# pre-final 8-expert / soft-mapping / warmstart-with-jitter defaults it
# replaces must not leak back in.

name: "phaseforge"
_target_: phaseforge.models.phase_moe.PhaseBootstrappedMoE

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: ${data.state_dim}
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true

action_head:
  _target_: phaseforge.models.components.action_head.ActionHead
  input_dim: 128
  output_dim: ${data.action_dim}
  head_type: "deterministic"
  hidden_dim: 256

phase_head:
  _target_: phaseforge.models.components.phase_head.PhaseClassificationHead
  latent_dim: 128
  num_phases: 6

router:
  _target_: phaseforge.models.components.router.TopKRouter
  latent_dim: 128
  num_experts: 6
  top_k: 2
  noise_std: 0.1
  balance_coeff: 0.01
  normalize_input: true   # Unit-norm latents + unit-norm centroid weights
                          # (set by bootstrap_moe) => true cosine routing.
  use_history: false

expert:
  _target_: phaseforge.models.components.expert.ExpertMLP
  input_dim: 128
  # Single hidden layer matching action_head.hidden_dim so the Stage 1
  # ActionHead can be copied into the experts exactly (strict warm start).
  hidden_dims: [256]
  output_dim: ${data.action_dim}
  activation: "gelu"

# Inert for the learned-routing R50 path (only used by oracle eval mode /
# teacher routing); disabled explicitly so the resolved config carries no
# soft-mapping machinery.
soft_mapping:
  enabled: false

teacher_routing:
  enabled: false

router_init:
  type: "centroid"
  mapping_mode: "prototype_softmax"   # unused for centroid; kept for schema
  temperature: 1.0
  seed: 42

expert_init:
  type: "partial_warm"
  drop_rate: 0.5
  seed: ${project.seed}   # tied to the training seed (recorded per run)
  jitter_std: 0.0        # partial_warm keeps rows as exact copies (no jitter)