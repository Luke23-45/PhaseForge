# config/models/phaseforge_dynamic.yaml — PhaseForge 2.0 primary (dynamic_dynamic).
# Dynamic-regime Stage 1 representation + dynamic prototypes for router bootstrap.
# Requires dynamics.enabled=true (e.g. dynamics@_global_=switching_linear_k6
# via config overrides). Both stages use 6 regimes/experts, top-2 routing,
# centroid prototypes, 50% partial warm-start, frozen encoder — matched to the
# canonical PhaseForge 1.0 contract.
# The deployed policy remains label-free; dynamic labels are training-time only.

name: "phaseforge_dynamic"
_target_: phaseforge.models.phase_moe.PhaseBootstrappedMoE

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: ${data.state_dim}
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true

action_head:
  _target_: phaseforge.models.components.action_head.ActionHead
  input_dim: 128
  output_dim: ${data.action_dim}
  head_type: "deterministic"
  hidden_dim: 256

phase_head:
  _target_: phaseforge.models.components.phase_head.PhaseClassificationHead
  latent_dim: 128
  num_phases: 6

router:
  _target_: phaseforge.models.components.router.TopKRouter
  latent_dim: 128
  num_experts: 6
  top_k: 2
  noise_std: 0.1
  balance_coeff: 0.01
  normalize_input: true
  use_history: false

expert:
  _target_: phaseforge.models.components.expert.ExpertMLP
  input_dim: 128
  hidden_dims: [256]
  output_dim: ${data.action_dim}
  activation: "gelu"

soft_mapping:
  enabled: false

teacher_routing:
  enabled: false

router_init:
  type: "centroid"
  prototype_source: "dynamic"
  mapping_mode: "prototype_softmax"
  temperature: 1.0
  seed: 42

expert_init:
  type: "partial_warm"
  drop_rate: 0.5
  seed: ${project.seed}
  jitter_std: 0.0
