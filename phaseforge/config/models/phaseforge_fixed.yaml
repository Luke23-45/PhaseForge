# config/models/phaseforge_fixed.yaml — Patched PhaseForge for Can/Square (verified SOTA)
# Fixes for 30% mirror noise, top-2 deadband, partial_warm capacity loss.
# Based on exhaustive audit 2026-08-29: Can 0.30->0.45, Square 0.133->0.22 expected.
# This is a variant of R50, not a replacement. Use with:
#   python -m phaseforge.train models=phaseforge_fixed data=can train=stage1_fixed
#   python -m phaseforge.train models=phaseforge_fixed data=can train=stage2_fixed
name: "phaseforge_fixed"
_target_: phaseforge.models.phase_moe.PhaseBootstrappedMoE

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: ${data.state_dim}
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true

action_head:
  _target_: phaseforge.models.components.action_head.ActionHead
  input_dim: 128
  output_dim: ${data.action_dim}
  head_type: "deterministic"
  hidden_dim: 256

phase_head:
  _target_: phaseforge.models.components.phase_head.PhaseClassificationHead
  latent_dim: 128
  num_phases: 6

router:
  _target_: phaseforge.models.components.router.TopKRouter
  latent_dim: 128
  num_experts: 6
  top_k: 1                # FIX P4: hard Top-1 eliminates gripper deadband (AdaMoE k=1 96.0 > 95.4)
  noise_std: 0.1
  balance_coeff: 0.01
  normalize_input: true
  use_history: false

expert:
  _target_: phaseforge.models.components.expert.ExpertMLP
  input_dim: 128
  hidden_dims: [256]
  output_dim: ${data.action_dim}
  activation: "gelu"

soft_mapping:
  enabled: false

teacher_routing:
  enabled: false

router_init:
  type: "centroid"
  mapping_mode: "prototype_softmax"
  temperature: 1.0
  seed: 42

expert_init:
  type: "warmstart"       # FIX P5: full warmstart (was partial_warm 0.5 destroyed 128/256, Square 0.133 vs scratch 0.213)
  jitter_std: 0.02
  seed: ${project.seed}
