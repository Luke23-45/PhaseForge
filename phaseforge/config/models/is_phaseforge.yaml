# config/models/is_phaseforge.yaml — IS-PhaseForge canonical model (WP5/WP7).
#
# Memoryless, observation-consistent, switched impedance MoE (Professor §16):
# SupCon-shaped encoder (enabled via train.supcon) -> large-margin
# prototype router (hard top-1) -> impedance-parameterized experts
# (target/gain adapter) with contraction regularization (train.lipschitz).
#
# Usage (Can pilot):
#   models=is_phaseforge data=can topo=topo_pelt_k6 train=stage1
#       train.supcon.enabled=true
#   models=is_phaseforge data=can topo=topo_pelt_k6 train=stage2
#       train.margin.enabled=true train.lipschitz.enabled=true
#       train.gain_reg.enabled=true
#
# Notes:
# - Stage 1 keeps the direct ActionHead: the shared encoder warm-starts
#   from action regression while SupCon shapes the latent geometry.
# - Impedance experts cannot warm-start from the ActionHead (different
#   output structure); expert_init MUST stay `random` (anything else fails
#   closed in warm_start_experts_from_action_head).
# - Router prototypes bootstrap from `phase_topo` (topo discovery must be
#   enabled and its audit passed); `rule` remains a valid fallback.

name: "is_phaseforge"
_target_: phaseforge.models.phase_moe.PhaseBootstrappedMoE

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: ${data.state_dim}
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true
  normalize_output: true

action_head:
  _target_: phaseforge.models.components.action_head.ActionHead
  input_dim: 128
  output_dim: ${data.action_dim}
  head_type: "deterministic"
  hidden_dim: 256

phase_head:
  _target_: phaseforge.models.components.phase_head.PhaseClassificationHead
  latent_dim: 128
  num_phases: 6

router:
  _target_: phaseforge.models.components.prototype_router.PrototypeRouter
  latent_dim: 128
  num_experts: 6
  top_k: 1
  margin: 0.5
  balance_coeff: 0.0001

expert:
  _target_: phaseforge.models.components.impedance_expert.ImpedanceExpert
  input_dim: 128
  hidden_dim: 256
  action_scale: 1.0
  kappa_min: 0.1
  kappa_max: 5.0

# Inert for the IS path (no soft mapping / teacher routing); disabled
# explicitly so the resolved config carries no legacy machinery.
soft_mapping:
  enabled: false

teacher_routing:
  enabled: false

router_init:
  type: "centroid"
  prototype_source: "topo"
  seed: ${project.seed}

expert_init:
  type: "random"
