# config/eval/rollout.yaml — Rollout evaluation config (environment-based)
#
# Override the default eval config via:
#   phaseforge-eval eval=rollout
#
# Uses LIBERO OffScreenRenderEnv to run online rollouts with the
# standard protocol: 50 episodes/task, 5 suites, binary success via
# goal predicates.

mode: "rollout"

environment:
  suites:
    - "libero_spatial"
    - "libero_object"
    - "libero_goal"
    - "libero_10"
    - "libero_90"
  num_steps_wait: 10      # Dummy steps at reset for physics to settle

evaluation:
  num_episodes_per_task: 50   # Standard LIBERO protocol (OpenVLA, LeRobot)
