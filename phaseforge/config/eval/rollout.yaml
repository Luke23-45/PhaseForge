# config/eval/rollout.yaml — Rollout evaluation config (environment-based)
#
# Override the default eval config via:
#   phaseforge-eval eval=rollout
#
# Uses LIBERO OffScreenRenderEnv to run online rollouts with the
# standard protocol: 50 episodes/task, 5 suites, binary success via
# goal predicates.

mode: "rollout"

environment:
  suites:
    - "libero_spatial"
    - "libero_object"
    - "libero_goal"
    - "libero_10"
    - "libero_90"
  num_steps_wait: 10      # Dummy steps at reset for physics to settle
  render_observations: false  # State-only policy: skip per-step camera
                              # rendering (dominant eval cost). Set true
                              # only to capture images/video.
  num_workers: 1              # >1 spawns parallel worker processes, each
                              # running a round-robin episode shard. Results
                              # are identical to serial; VRAM scales roughly
                              # linearly with worker count (one model per
                              # worker). Recommended: 2-4 on a single GPU.

evaluation:
  num_episodes_per_task: 50   # Standard LIBERO protocol (OpenVLA, LeRobot)
