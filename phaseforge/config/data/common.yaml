# config/data/common.yaml — Shared data parameters

batch_size: 256
num_workers: 2
pin_memory: true
persistent_workers: true
prefetch_factor: 2

sequence_length: 1        # Single-step training; override to >1 for chunked
stride: 1                 # Stride between samples in index map

normalization_strategy: "zscore"   # zscore | minmax

# State keys to extract from LIBERO HDF5 (in concatenation order)
state_keys:
  - key: "robot0_joint_pos"
    dim: 7
  - key: "robot0_joint_vel"
    dim: 7
  - key: "robot0_eef_pos"
    dim: 3
  - key: "robot0_eef_quat"
    dim: 4
  - key: "robot0_gripper_qpos"
    dim: 2

action_key: "actions"
action_dim: 7

# P-Stage 1 object-state channel: per-object world poses decoded (numpy-only)
# from the mirror's demo/states arrays via the census-built index table
# (phaseforge.data.scripts.build_object_index -> {data_root}/raw/libero/object_index.json).
# State layout: [proprio (23) | object_block (k_slots*7) | mask (k_slots)].
# k_slots is a fixed upper bound for ALL 90 tasks (zero-pad underfilled);
# the census reports the true max — lowering it later re-ingests the cache.
# The mask dims are excluded from normalization (already binary).
object_state:
  enabled: true
  k_slots: 8             # census-tightened (patch 0 rebuild: max 8 objects, B6-gated); decoder fails loud if exceeded
  dim_per_object: 7      # world pos (3) + quat (4) — must match object_state.py
  include_mask: true
  index_path: null       # null -> {data_root}/raw/libero/object_index.json

# Must equal 23 (proprio) + k_slots*7 (objects) + k_slots (mask).
# Manually maintained here and in every model config (input_dim); it is
# NOT derived automatically — the ingest pipeline validates it at runtime
# (state_machine._load_object_index / _check_state_dim_consistency) and
# fails loudly on mismatch.
state_dim: 87

# Cache root (relative to project output_dir or absolute)
cache_root: "cache"

# When true, the data ingestion pipeline requires an exact cache hash match.
# When false, it will fall back to using any valid complete cache found in the cache_root
# if the expected hash misses (useful when using downloaded pre-processed caches).
enforce_strict_cache: false
