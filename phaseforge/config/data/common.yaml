# Shared data parameters for the non-visual robomimic/robosuite protocol.

batch_size: 256
num_workers: 2
pin_memory: true
persistent_workers: true
prefetch_factor: 2

# The current model/trainer path is single-step. History support is a required
# follow-up before making a history-dependent claim.
sequence_length: 1
stride: 1

normalization_strategy: "zscore"

# Primary single-task pilot schema: privileged structured low-dimensional state.
# It is intentionally not RGB and not bare robot proprioception.
state_keys:
  - key: "robot0_eef_pos"
    dim: 3
  - key: "robot0_eef_quat"
    dim: 4
  - key: "robot0_gripper_qpos"
    dim: 2
  - key: "object"
    dim: 10

action_key: "actions"
action_dim: 7
state_dim: 19
schema_version: "robomimic-lift-structured-v1"
action_contract:
  representation: "delta_eef_pose_plus_gripper"
  range: [-1.0, 1.0]
  gripper_convention: "robosuite_action_convention"

source:
  name: "robomimic"
  # Override PHASEFORGE_DATA_DIR or data.source.dir on each machine. Raw data
  # must remain outside the repository and must not be downloaded by training.
  dir: "${oc.env:PHASEFORGE_DATA_DIR,data}/raw/robomimic/lift"
  manifest_path: null

phase_labeler:
  _target_: phaseforge.data.robomimic.phase_labeler.RuleBasedPhaseLabeler
  num_phases: 6
  gripper_closed_threshold: 0.02
  gripper_open_threshold: 0.04
  eef_velocity_threshold: 0.01
  min_phase_duration: 5
  median_filter_size: 7
  eef_pos_slice: [0, 3]
  gripper_qpos_slice: [7, 9]

ingester:
  _target_: phaseforge.data.robomimic.ingester.RobomimicHDF5Ingester
  state_keys: ${data.state_keys}
  action_key: ${data.action_key}
  action_dim: ${data.action_dim}
  phase_labeler: ${data.phase_labeler}

# One policy per task is the primary protocol. Within-task trajectory splits
# keep validation available for the single-task pilot without task leakage.
split:
  strategy: "trajectory"
  val_ratio: 0.1
  seed: 42

# Cache reuse is fail-closed: a different schema/source/split may not be used.
enforce_strict_cache: true

# Cache root (resolved under the shared data root by the cache manager).
cache_root: "cache"
